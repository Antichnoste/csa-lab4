name: CI

on:
  push:
  pull_request:

jobs:
  test-golden:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ЛР_4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-golden

      - name: Run golden tests
        run: python -m pytest test_golden.py -q
